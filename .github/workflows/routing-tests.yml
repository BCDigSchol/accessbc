# Tests for the routing modules (graph building, routes, step wording, shuttle schedules, slopes), run on pushes to
# dev and on pull requests into main. See tests/routing/. No packages to install.
name: Routing tests

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test tests/routing/*.test.mjs
