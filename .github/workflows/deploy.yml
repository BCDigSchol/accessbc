# Publishes the site to GitHub Pages on every push to main.
# The site is plain static files, so there is no build step: this copies the pages (index.html, help.html) and src/
# into the Pages artifact, leaving out scripts, docs, and anything else in the repo.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Assemble site
        run: |
          mkdir _site
          cp -R index.html help.html src _site/
          # Browsers keep files for up to 10 minutes, so right after a deploy a returning visitor could get new
          # and old files mixed together. Stamp this deploy's version onto the page's scripts and styles, and onto
          # the routing modules' imports of each other (directions.js passes its own stamp to the ones it loads).
          v="${GITHUB_SHA::8}"
          sed -i -E "s#(src|href)=\"(src/[^\"?]+\.(js|css))\"#\1=\"\2?v=$v\"#g" _site/index.html _site/help.html
          sed -i -E "s#from '(\./[^'?]+\.mjs)'#from '\1?v=$v'#g" _site/src/js/routing/*.mjs

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
