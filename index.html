<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Access BC</title>
<meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
<link href="src/vendor/maplibre-gl/maplibre-gl.css" rel="stylesheet">
<link href="src/input.css" rel="stylesheet">
<script src="src/vendor/maplibre-gl/maplibre-gl.js"></script>
<script src="src/vendor/pmtiles/pmtiles.js"></script>
<script src="src/basemap/style.js"></script>
<script src = "src/js/map.js"></script>
<script src="src/js/mapcontrols.js"></script>
<script src="src/js/datasources.js"></script>
<script src="src/js/popups.js"></script>
<script src="src/js/elevation.js"></script>
<script src = "src/js/menu.js"></script>
<script src = "src/js/searchbar.js"></script>
<script src="src/js/directions.js"></script>
</head>
<body>

<div id="map"></div>
<div id="building-popup">
  <div id="building-info">Click on a building to see details here.</div>
</div>

<div class="topnav" id="myTopnav">
  <!-- Title Section -->
  <div class="title-container">
    <span class="main-title">Access BC</span>
  </div>

  <!-- Hamburger Menu -->
  <div class="icon" onclick="toggleMenu()">☰</div>

  <!-- Navigation Buttons -->
  <button href="#about" id="about" class="menu-button">About</button>
  <button href="#home" id="chestnut-hill" class="menu-button">Chestnut Hill</button>
  <button href="#brighton" id="brighton" class="menu-button">Brighton</button>
  <button href="#newton" id="newton" class="menu-button">Newton</button>
  <button href="#brookline" id="brookline" class="menu-button">Brookline</button>
  <button id="directions-toggle" aria-expanded="false" aria-controls="directions-panel" disabled>Directions</button>

  <!-- Search Bars -->
  <div class="search-bar-container">
    <input type="text" class="search-bar" id="generic-search" placeholder="Select a resource...">
    <div class="search-dropdown" id="generic-dropdown"></div>
  </div>
</div>

    <div id="legend"></div>

<section id="directions-panel" aria-labelledby="directions-title" hidden>
  <button type="button" id="directions-close" class="directions-close" aria-label="Close directions">×</button>
  <h2 id="directions-title">Accessible directions</h2>
  <div class="route-field">
    <label for="route-from">From</label>
    <select id="route-from"></select>
  </div>
  <div class="route-actions">
    <button type="button" id="route-swap">Swap ⇅</button>
    <button type="button" id="route-clear">Clear</button>
  </div>
  <div class="route-field">
    <label for="route-to">To</label>
    <select id="route-to"></select>
  </div>
  <div id="route-result" aria-live="polite"></div>
  <p class="route-legend"><span class="route-swatch"></span> Outdoors <span class="route-swatch indoor"></span> Indoors</p>
  <p id="route-coverage" class="route-note"></p>
</section>

</body>
</html>
